version: "2"
type: backend
tech_stack:
  - Deno / TypeScript (Supabase Edge Functions)
  - PostgreSQL (Supabase managed) + PostgREST
  - Supabase Auth (JWT, email+password grant)
  - Supabase Storage
features:
  - name: Authentication
    description: >
      Login via POST /auth/v1/token?grant_type=password with JSON body
      {"email","password"}. apikey header is the Supabase anon key and is
      MANDATORY on every request. Returns access_token (JWT).
    files:
      - supabase (auth.users)
    endpoints:
      - method: POST
        path: /auth/v1/token?grant_type=password
        description: >
          Login test-client@bora.app / TestBora2026! → 200 with access_token.
          Body MUST be JSON (NOT form-data). apikey header required.
        auth_required: false
        request_schema:
          headers:
            apikey: "<anon_key>"
            Content-Type: application/json
          body:
            email: string
            password: string
        response_schema:
          "200":
            access_token: string
            user: object
          "400": invalid_credentials / bad_json
    depends_on: []
  - name: RLS Orders (SELECT isolation)
    description: >
      orders table has RLS. Authenticated client sees ONLY rows where
      user_id = auth.uid(). Other clients' orders are invisible.
      Unauthenticated (no Bearer) request returns 401.
    files:
      - supabase/migrations (orders RLS policies)
    endpoints:
      - method: GET
        path: /rest/v1/orders?select=id,user_id,status
        description: >
          With valid client JWT + apikey → 200, returns only that client's
          orders. Without Authorization Bearer (apikey only) → 401 or empty
          per RLS.
        auth_required: true
        request_schema:
          headers:
            apikey: "<anon_key>"
            Authorization: "Bearer <jwt>"
        response_schema:
          "200": "Order[] (only own rows)"
          "401": unauthorized when no JWT
    depends_on:
      - Authentication
  - name: Orders real schema (for any INSERT)
    description: >
      orders columns (REAL — there is NO 'currency', NO 'total_cents',
      NO 'amount' column). id TEXT default gen_random_uuid(); user_id UUID
      (must equal auth.uid() for RLS insert); status TEXT; items JSONB NOT
      NULL default '[]'; payment_status TEXT NOT NULL default 'pending';
      price/subtotal/total/customer_total NUMERIC; service_type TEXT;
      order_type TEXT; is_test_order BOOLEAN default false.
      Minimal valid insert payload:
      {"user_id":"<auth.uid()>","status":"created","items":[],"is_test_order":true}
    files:
      - supabase (public.orders)
    endpoints:
      - method: POST
        path: /rest/v1/orders
        description: >
          Insert order. RLS WITH CHECK requires user_id = auth.uid().
          Set Prefer: return=representation to get the row back. Always set
          is_test_order=true so test rows are identifiable. NEVER send a
          'currency' field — column does not exist (PGRST204).
        auth_required: true
        request_schema:
          headers:
            apikey: "<anon_key>"
            Authorization: "Bearer <jwt>"
            Prefer: return=representation
          body:
            user_id: string
            status: string
            items: array
            is_test_order: boolean
        response_schema:
          "201": Order
          "400": PGRST204 if unknown column sent
          "403": RLS violation if user_id != auth.uid()
    depends_on:
      - Authentication
  - name: Wallet RPC
    description: RPC wallet_get_balance returns wallet + tokens for the auth user.
    files:
      - supabase (rpc wallet_get_balance)
    endpoints:
      - method: POST
        path: /rest/v1/rpc/wallet_get_balance
        description: >
          With JWT + apikey and body {"p_user_id":"<auth.uid()>"} → 200 with
          free_cents, tokens_balance, last_transactions. No auth → 401.
        auth_required: true
        request_schema:
          headers:
            apikey: "<anon_key>"
            Authorization: "Bearer <jwt>"
          body:
            p_user_id: string
        response_schema:
          "200":
            free_cents: number
            tokens_balance: number
            last_transactions: array
          "401": unauthorized
    depends_on:
      - Authentication
  - name: Notifications Edge Function
    description: notify-client Edge Function (requires authenticated JWT).
    files:
      - supabase/functions/notify-client/index.ts
    endpoints:
      - method: POST
        path: /functions/v1/notify-client
        description: >
          With valid JWT + apikey + body {user_id,title,body} → should NOT
          return 401 (auth accepted). May return 200 or a domain error, but
          the test asserts it is not an auth rejection.
        auth_required: true
        request_schema:
          headers:
            apikey: "<anon_key>"
            Authorization: "Bearer <jwt>"
          body:
            user_id: string
            title: string
            body: string
    depends_on:
      - Authentication
known_limitations:
  - issue: Backend is Supabase cloud at https://ojykpzwqrtusfeakzrna.supabase.co — no localhost
    location: all endpoints
    impact: tests must target the cloud base URL, apikey header mandatory everywhere
  - issue: demo accounts cliente@bora.app/123456 do NOT exist in auth.users
    location: auth
    impact: use ONLY test-client@bora.app / TestBora2026! and test-driver@bora.app / TestBora2026!
