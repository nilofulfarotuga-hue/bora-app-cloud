name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: false

      - name: Versão do Flutter
        run: flutter --version

      - name: Versões do ambiente
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null | tail -5 || true

      - name: Limpar build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee /tmp/flutter_build.log
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Capturar erros do build (se falhar)
        if: failure()
        run: |
          echo "## Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "FAILURE:|Caused by:|error: |> Could not|e: |Task.*FAILED" /tmp/flutter_build.log | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "--- Last 80 lines ---" >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/flutter_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Also output as annotations
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E "FAILURE:|Caused by:|error: |> Could not|e: |Task.*FAILED" /tmp/flutter_build.log | head -20 || true)

      - name: Verificar APK gerado
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK INFO ==="
          echo "Run number  : ${{ github.run_number }}"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Flutter     : $(flutter --version | head -1)"
          echo "Tamanho     : $(du -sh $APK_PATH | cut -f1)"
          echo "SHA256      : $(sha256sum $APK_PATH)"
          echo "================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-run${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
