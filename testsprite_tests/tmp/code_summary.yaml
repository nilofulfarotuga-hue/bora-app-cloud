version: "2"
type: backend
tech_stack:
  - Deno / TypeScript (Supabase Edge Functions)
  - PostgreSQL (Supabase managed) + PostgREST + RLS
  - Supabase Auth (JWT, email+password grant)
features:
  - name: Authentication
    description: >
      POST /auth/v1/token?grant_type=password with JSON body {"email","password"}
      and mandatory apikey header. Returns access_token. Wrong creds -> 400/401.
    endpoints:
      - method: POST
        path: /auth/v1/token?grant_type=password
        description: Login (JSON, never form-data). apikey header required.
        auth_required: false
  - name: RLS Orders
    description: >
      orders RLS: SELECT/INSERT only where user_id = auth.uid(). Other clients'
      rows invisible. Insert with foreign user_id -> 403. No JWT -> 401.
      Real columns (NO currency/total_cents/amount): id TEXT default
      gen_random_uuid(); user_id UUID; status TEXT; items JSONB NOT NULL;
      payment_status TEXT default 'pending'; price/subtotal/total/customer_total
      NUMERIC; vendor_name TEXT; restaurant_id TEXT; is_test_order BOOLEAN.
      Minimal insert: {"user_id":"<auth.uid()>","status":"created","items":[],
      "vendor_name":"Pizzaria Teste 27","is_test_order":true}.
    endpoints:
      - method: GET
        path: /rest/v1/orders?select=id,user_id,status,vendor_name
        description: With JWT -> only own rows. No Authorization -> 401.
        auth_required: true
      - method: POST
        path: /rest/v1/orders
        description: Insert own order (user_id must equal auth.uid()). Prefer return=representation.
        auth_required: true
  - name: Wallet and Tokens
    description: >
      wallet_get_balance RPC returns own wallet. bora_tokens table readable by
      owner only. Reading another user's wallet/tokens returns empty/forbidden.
    endpoints:
      - method: POST
        path: /rest/v1/rpc/wallet_get_balance
        description: Body {"p_user_id":"<auth.uid()>"} with JWT -> 200 balance.
        auth_required: true
      - method: GET
        path: /rest/v1/bora_tokens?select=id,amount,role
        description: With JWT -> only own tokens.
        auth_required: true
  - name: Edge Functions
    description: >
      notify-client, notify-driver require authenticated JWT (assert not 401).
      client-cancel-order with non-existent order -> controlled error (not 500).
      create-payment-intent with authenticated client -> client_secret or
      controlled error (not 500).
    endpoints:
      - method: POST
        path: /functions/v1/notify-client
        description: JWT + {user_id,title,body} -> not 401.
        auth_required: true
      - method: POST
        path: /functions/v1/notify-driver
        description: JWT + {driver_id,order_id,type} -> not 401.
        auth_required: true
      - method: POST
        path: /functions/v1/client-cancel-order
        description: JWT + {order_id:"nonexistent"} -> controlled 4xx, never 500.
        auth_required: true
      - method: POST
        path: /functions/v1/create-payment-intent
        description: JWT + {order_id,amount,...} -> client_secret or controlled error, never crash.
        auth_required: false
  - name: Security
    description: >
      SQL injection in search params rejected by PostgREST. Unknown column on
      insert -> 400 PGRST204. ledger_entries with no JWT -> 401.
      client_wallets not readable by a different role (driver) per RLS.
    endpoints:
      - method: GET
        path: /rest/v1/ledger_entries
        description: No Authorization -> 401.
        auth_required: false
      - method: GET
        path: /rest/v1/client_wallets
        description: Driver JWT reading another user's wallet -> empty/forbidden by RLS.
        auth_required: true
known_limitations:
  - issue: Supabase cloud only (no localhost); apikey header mandatory everywhere
    location: all endpoints
    impact: target https://ojykpzwqrtusfeakzrna.supabase.co
  - issue: only test-*@bora.app users exist; cliente@bora.app/123456 does NOT exist
    location: auth
    impact: use the 5 test-* accounts with password TestBora2026!
