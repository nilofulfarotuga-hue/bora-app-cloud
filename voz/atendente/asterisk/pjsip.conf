; Linha da Zadarma por SIP URI (26/11/2026): a Zadarma manda as chamadas do número
; direto para <número>@<IP da VPS>. Sem registo e sem senha SIP guardada na VPS.
; Só entram pedidos vindos dos servidores da Zadarma (identify por anfitrião, lista oficial
; da Zadarma para Asterisk PJSIP); o resto o Asterisk recusa.
[transporte-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@IP_PUBLICO@
external_signaling_address=@IP_PUBLICO@

[zadarma]
type=endpoint
transport=transporte-udp
context=entrada-zadarma
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[zadarma]
type=identify
endpoint=zadarma
match=sip.zadarma.com
match=sipurifr.zadarma.com
match=sipde.zadarma.com
match=sipuriny.zadarma.com
; Redes da Zadarma vistas a 26/11/2026 (os nomes acima trocam de IP a cada consulta).
match=185.45.152.0/24
match=185.45.155.0/24
match=195.122.19.0/27
