name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: false

      - name: Versão do Flutter
        run: flutter --version

      - name: Limpar build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=2048m"

      - name: Verificar APK gerado
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK INFO ==="
          echo "Run number : ${{ github.run_number }}"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Tamanho    : $(du -sh $APK_PATH | cut -f1)"
          echo "SHA256     : $(sha256sum $APK_PATH)"
          echo "================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-run${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
