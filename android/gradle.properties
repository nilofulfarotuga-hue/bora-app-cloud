# BUILD-APK-FIX-v3 (2026-05-18) — REVERT para Xmx 512m original.
# Tentativa anterior (4g e 2g) causou OOM no Windows do Danilo:
#   "Failed to reserve memory for new overflow mark stack" / G1 virtual space.
# Page file insuficiente. Esta config funcionava antes desta sessao —
# o problema real era duplicate_definition em order_store.dart (fixado).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
# Sessão 2026-05-24 (exec5) — PC com 3.9GB RAM. workers.max=1 evita
# Gradle spawnar 2+ workers em paralelo (cada um ~500MB) que matam o
# sistema por swap excessivo. caching=false poupa I/O em PC com disco cheio.
org.gradle.workers.max=1
org.gradle.caching=false
android.useAndroidX=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# BUILD-APK-FIX (2026-05-18) — Opt-out do "new DSL" do AGP 9+.
# Flutter ferramenta actual ativa `android.newDsl=true` por defeito quando
# deteta AGP 9+, e isso quebra a aplicacao do Flutter Gradle plugin no
# android/app/build.gradle.kts (pattern antigo). Esta flag preserva o
# pattern em uso ate a migracao AGP 9 estar completa.
# Doc: https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.newDsl=false
