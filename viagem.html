<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Viagem partilhada — Bora</title>
<!--
  Viagem partilhada em tempo real (04/10/2026, como a Uber/Bolt).
  O cliente envia este link a alguém de confiança. A página chama a RPC
  pública tvde_ver_partilha (chave pública) e atualiza a cada 10 s. Mostra só
  o nome próprio do motorista, o carro, a matrícula, a posição atual, a zona do
  destino e a hora prevista — nunca telefones nem a morada exata de recolha.
  O link deixa de funcionar 30 minutos depois de a viagem terminar.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --verde:#16A34A; --laranja:#F97316; --texto:#111827; --cinza:#6B7280; --borda:#E5E7EB; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--texto); background:#fff; display:flex; flex-direction:column;
  }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px 8px; }
  .marca { font-size:20px; font-weight:800; color:var(--verde); letter-spacing:-.5px; }
  .tag { font-size:12px; color:var(--cinza); }
  #mapa { flex:1; min-height:280px; background:#F3F4F6; }
  .cartao { padding:14px 16px 22px; border-top:1px solid var(--borda); }
  .estado { font-size:18px; font-weight:700; margin:0 0 4px; }
  .eta { font-size:14px; color:var(--verde); font-weight:600; margin:0 0 10px; }
  .linha { font-size:14px; margin:4px 0; }
  .linha b { font-weight:600; }
  .matricula {
    display:inline-block; padding:2px 8px; border:1px solid var(--texto);
    border-radius:4px; font-weight:700; letter-spacing:1px; font-size:13px;
  }
  .aviso { font-size:12px; color:var(--cinza); margin-top:10px; }
  #msg { padding:48px 20px; text-align:center; color:var(--cinza); font-size:15px; display:none; }
</style>
</head>
<body>
<header>
  <span class="marca">Bora</span>
  <span class="tag">Viagem partilhada</span>
</header>
<div id="msg"></div>
<div id="mapa"></div>
<div class="cartao" id="cartao">
  <p class="estado" id="estado">A carregar…</p>
  <p class="eta" id="eta"></p>
  <p class="linha" id="motorista"></p>
  <p class="linha" id="carro"></p>
  <p class="linha" id="destino"></p>
  <p class="aviso" id="atualizado"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';
  var URL_SB = 'https://ojykpzwqrtusfeakzrna.supabase.co';
  var CHAVE = 'sb_publishable_ylfhSuS2D_JoKmtFY-x6-A_DlOgHhVP';
  var token = new URLSearchParams(window.location.search).get('t') || '';

  var mapa = null, carro = null, alvo = null, centrado = false, temporizador = null;

  function el(id) { return document.getElementById(id); }
  function texto(id, t) { el(id).textContent = t || ''; }

  function mostrarMensagem(t) {
    el('mapa').style.display = 'none';
    el('cartao').style.display = 'none';
    var m = el('msg'); m.style.display = 'block'; m.textContent = t;
    if (temporizador) { clearInterval(temporizador); temporizador = null; }
  }

  function hora(iso) {
    try {
      return new Intl.DateTimeFormat('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' })
        .format(new Date(iso));
    } catch (e) { return ''; }
  }

  function prepararMapa() {
    if (mapa || !window.L) return;
    mapa = L.map('mapa', { zoomControl: true }).setView([40.537, -7.267], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
  }

  function desenhar(d) {
    prepararMapa();
    if (!mapa) return;
    if (d.destino_lat != null && d.destino_lng != null) {
      var pd = [Number(d.destino_lat), Number(d.destino_lng)];
      if (!alvo) {
        alvo = L.circle(pd, { radius: 500, color: '#F97316', fillColor: '#F97316', fillOpacity: .15, weight: 2 }).addTo(mapa);
      } else { alvo.setLatLng(pd); }
    }
    if (d.lat != null && d.lng != null) {
      var pc = [Number(d.lat), Number(d.lng)];
      if (!carro) {
        carro = L.circleMarker(pc, { radius: 9, color: '#fff', weight: 3, fillColor: '#16A34A', fillOpacity: 1 }).addTo(mapa);
      } else { carro.setLatLng(pc); }
      if (!centrado) {
        if (alvo) { mapa.fitBounds(L.latLngBounds([pc, alvo.getLatLng()]).pad(0.3)); }
        else { mapa.setView(pc, 15); }
        centrado = true;
      }
    } else if (alvo && !centrado) {
      mapa.setView(alvo.getLatLng(), 14); centrado = true;
    }
  }

  function aplicar(d) {
    if (!d || d.ok !== true) {
      mostrarMensagem(d && d.motivo === 'expirada'
        ? 'Esta viagem já terminou e o link deixou de estar ativo.'
        : 'Este link de viagem não é válido.');
      return;
    }
    texto('estado', d.estado_texto || 'Viagem');
    texto('eta', d.eta_min ? ('Chegada prevista em cerca de ' + d.eta_min + ' min') : '');
    el('motorista').innerHTML = '';
    if (d.motorista) {
      var b = document.createElement('b'); b.textContent = d.motorista;
      el('motorista').append('Motorista: ', b);
    }
    el('carro').innerHTML = '';
    var carroTxt = [d.carro, d.cor].filter(Boolean).join(' · ');
    if (carroTxt) el('carro').append(carroTxt + ' ');
    if (d.matricula) {
      var s = document.createElement('span'); s.className = 'matricula'; s.textContent = d.matricula;
      el('carro').append(s);
    }
    texto('destino', d.destino_zona ? ('Destino: ' + d.destino_zona) : '');
    var aviso = 'Atualizado às ' + hora(d.atualizado_em) + '.';
    if (d.posicao_em) {
      var idade = (Date.now() - new Date(d.posicao_em).getTime()) / 60000;
      if (idade > 3) aviso += ' A posição do carro pode estar desatualizada.';
    }
    texto('atualizado', aviso);
    desenhar(d);
    if (d.terminada && temporizador) { clearInterval(temporizador); temporizador = null; }
  }

  function ler() {
    fetch(URL_SB + '/rest/v1/rpc/tvde_ver_partilha', {
      method: 'POST',
      headers: { 'apikey': CHAVE, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token })
    })
      .then(function (r) { return r.json(); })
      .then(aplicar)
      .catch(function () {
        texto('atualizado', 'Sem ligação. A tentar de novo…');
      });
  }

  if (!token || token.length < 32) {
    mostrarMensagem('Este link de viagem não é válido.');
    return;
  }
  ler();
  temporizador = setInterval(ler, 10000);
})();
</script>
</body>
</html>
