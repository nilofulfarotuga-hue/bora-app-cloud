# Subflow: login do cliente de teste (reutilizável via runFlow)
# Conta de TESTE: teste-cliente@bora.app — criada por criar-contas-teste.py; a password real
# vem do runner via --env (lida de .env). NOTA: cliente@bora.app NÃO existe no Supabase Auth
# (o login do cliente vai sempre ao Supabase — o "demo in-memory" não cobre este ecrã).
appId: pt.boraapp.bora
env:
  CLIENT_EMAIL: teste-cliente@bora.app
  CLIENT_PASSWORD: "definida-no-.env"
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Sou Cliente"
    commands:
      - tapOn: "Sou Cliente"
# conta lembrada pré-preenchida → limpar primeiro (senão o inputText concatena)
- runFlow:
    when:
      visible: "Entrar com outra conta"
    commands:
      - tapOn: "Entrar com outra conta"
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "Email"
      - eraseText: 80
      - inputText: ${CLIENT_EMAIL}
      - tapOn: "Palavra-passe"
      - eraseText
      - inputText: ${CLIENT_PASSWORD}
      - hideKeyboard
      - tapOn: "Entrar"
# 1º login neste device pode perguntar "Entrar com biometria?" → recusar no teste
- extendedWaitUntil:
    visible: "Agora não|Início"
    timeout: 45000
- runFlow:
    when:
      visible: "Agora não"
    commands:
      - tapOn: "Agora não"
# resultado esperado: home do cliente com a bottom nav
- extendedWaitUntil:
    visible: "Início"
    timeout: 45000
