; Chamada que chega da Zadarma -> central (AudioSocket em 127.0.0.1:9092).
; O número de quem liga vai num ficheiro com o nome da chamada (a central lê-o).
; Se a central não responder, toca a mensagem de recurso e desliga.
[entrada-zadarma]
exten => _X.,1,Answer()
 same => n,Set(UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,System(echo '${FILTER(0-9+,${CALLERID(num)})}' > /var/voz/${UUID})
 same => n,AudioSocket(${UUID},127.0.0.1:9092)
 same => n,Playback(/etc/asterisk-bora/sons/recurso)
 same => n,System(rm -f /var/voz/${UUID})
 same => n,Hangup()

exten => s,1,Goto(entrada-zadarma,0,1)
