appId: com.example.bora_app
name: Parceiro — Rejeitar pedido com motivo
tags:
  - parceiro
  - pedidos
---
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_parceiro.yaml

- runFlow:
    when:
      visible: "Rejeitar"
    commands:
      # Parceiro rejeita directamente sem dialog de motivo
      # (confirmado em partner_dashboard_screen.dart L1095/L1115).
      # Sucesso = SnackBar "Pedido rejeitado" (L688).
      - tapOn:
          text: "Rejeitar"
          index: 0
      - extendedWaitUntil:
          visible:
            text: "Pedido rejeitado"
          timeout: 15000
