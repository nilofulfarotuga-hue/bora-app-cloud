<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A Semente da Luz — s02 o sótão (motion 2D)</title>
<style>
@font-face { font-family:'Inter'; src:url('../assets/Inter-VariableFont.ttf') format('truetype'); font-weight:100 900; }
html,body { margin:0; background:#000; overflow:hidden; font-family:'Inter',sans-serif; }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#2A1C12; transform-origin:0 0; overflow:hidden; }
body.port #stage { width:1080px; height:1920px; }
.el { position:absolute; left:0; top:0; will-change:transform,opacity; }
.hidden { visibility:hidden; }
#room { left:0; top:0; width:100%; height:100%; }
#glow { left:50%; top:50%; width:900px; height:900px; margin:-450px 0 0 -450px; border-radius:999px; background:radial-gradient(circle, #FFF3C4 0%, #FFD54F 14%, #4FC3F7 40%, rgba(79,195,247,0) 68%); filter:blur(10px); transform-origin:50% 50%; }
.kid { transform-origin:50% 100%; }
.kid img { height:640px; display:block; }
body.port .kid img { height:520px; }
.paper { width:60px; height:44px; background:#EFE6D2; transform-origin:50% 50%; }
#black { left:0; top:0; width:100%; height:100%; background:#000; }
#lbl { left:40px; top:30px; font-size:26px; font-weight:600; color:rgba(255,255,255,.55); letter-spacing:.1em; }
</style>
</head>
<body>
<div id="stage">
  <svg id="room" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
    <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B120B"/><stop offset="1" stop-color="#4A3321"/></linearGradient></defs>
    <rect width="1920" height="1080" fill="url(#wall)"/>
    <!-- vigas do telhado -->
    <g stroke="#6B4A2E" stroke-width="34" stroke-linecap="round" opacity=".9"><path d="M0 420 L960 40 L1920 420"/><path d="M300 300 L300 1080 M1620 300 L1620 1080"/><path d="M960 40 L960 300"/></g>
    <g stroke="#5A3D26" stroke-width="18" opacity=".8"><path d="M560 200 L560 1080 M1360 200 L1360 1080"/></g>
    <!-- janela redonda com noite azul -->
    <circle cx="960" cy="330" r="110" fill="#1E2A52" stroke="#6B4A2E" stroke-width="22"/><path d="M960 220 V440 M850 330 H1070" stroke="#6B4A2E" stroke-width="14"/>
    <circle cx="995" cy="300" r="22" fill="#F2E4C6" opacity=".9"/>
    <!-- chão -->
    <rect y="860" width="1920" height="220" fill="#3B2A1C"/>
    <g stroke="#2A1C12" stroke-width="4"><path d="M0 900 H1920 M0 950 H1920 M0 1000 H1920 M0 1050 H1920"/></g>
    <!-- caixas e tralha -->
    <rect x="120" y="700" width="220" height="160" rx="8" fill="#B08A5A"/><rect x="150" y="640" width="160" height="70" rx="6" fill="#C49A66"/>
    <rect x="1560" y="720" width="260" height="140" rx="8" fill="#A67F52"/><rect x="1600" y="600" width="180" height="130" rx="6" fill="#B08A5A"/>
    <!-- o baú no centro -->
    <g id="bau"><rect x="810" y="760" width="300" height="140" rx="12" fill="#5C3A1E" stroke="#3A2412" stroke-width="8"/><rect x="800" y="740" width="320" height="34" rx="8" fill="#6E4727"/><rect x="940" y="790" width="40" height="40" rx="6" fill="#D9A441"/>
      <g id="tampa" transform="translate(960 745)"><rect x="-160" y="-60" width="320" height="60" rx="14" fill="#6E4727" stroke="#3A2412" stroke-width="8"/></g></g>
  </svg>
  <div id="glow" class="el"></div>
  <div id="papers"></div>
  <div id="k1" class="el kid"><img src="../assets/antony_frente.png" alt=""></div>
  <div id="k2" class="el kid"><img src="../assets/tabita_frente.png" alt=""></div>
  <div id="k3" class="el kid"><img src="../assets/tailine_frente.png" alt=""></div>
  <div id="k4" class="el kid"><img src="../assets/gustavo_frente.png" alt=""></div>
  <div id="black" class="el"></div>
  <div id="lbl" class="el">b1 · s02 — o sótão · motion 2D</div>
</div>
<script src="../_engine.js"></script>
<script>
fitStage();
const papers = []; for (let i = 0; i < 16; i++) { const d = document.createElement('div'); d.className = 'el paper'; $('papers').appendChild(d); papers.push(d); }
// o baú está em (960, 760) no viewBox 1920x1080 "slice" → calcular a posição no palco
const roomScale = Math.max(SW / 1920, SH / 1080); const offX = (SW - 1920 * roomScale) / 2, offY = SH - 1080 * roomScale;
const bau = { x: offX + 960 * roomScale, y: offY + 760 * roomScale };
$('glow').style.left = bau.x + 'px'; $('glow').style.top = bau.y + 'px'; $('glow').style.margin = '-450px 0 0 -450px';
const KH = PORT ? 520 : 640;
const home = PORT ? [[120, 1500], [330, 1460], [620, 1480], [840, 1520]] : [[330, 1010], [600, 980], [1200, 990], [1480, 1020]];
function seek(t) {
  // tampa abre em 0.8 (estrondo); o clarão cresce
  const open = prog(t, 0.8, 1.5, 'pop');
  $('tampa').setAttribute('transform', `translate(960 745) rotate(${-110 * open})`);
  const g = prog(t, 0.9, 2.2, 'out'); const pulse = 1 + 0.06 * Math.sin(t * 9);
  apply($('glow'), { x: 0, y: 0, s: g * pulse * (1 + 0.3 * prog(t, 2.0, 9.0, 'lin')), o: g * 0.95, r: 0 });
  // crianças: paradas até 2.0, depois puxadas (pés a arrastar), Antony e Tabita por último de mãos dadas
  const order = [2.4, 2.9, 4.2, 5.2];
  ['k1', 'k2', 'k3', 'k4'].forEach((id, i) => {
    const el = $(id); const t0 = [5.4, 5.4, 2.2, 3.2][i]; const t1 = t0 + 3.2;
    const p = prog(t, t0, t1, 'inq');
    const hx = home[i][0], hy = home[i][1];
    const tx = bau.x - 60, ty = bau.y + 20;
    const idle = Math.sin(t * 2 + i) * 4;
    const drag = t > 1.0 && t < t0 ? Math.sin(t * 14 + i) * 5 : 0; // tremer com o vento antes de ser puxado
    const x = lerp(hx, tx - 100, p), y = lerp(hy - KH, ty - KH, p) + idle;
    const lean = t > 1.0 ? lerp(0, (hx < bau.x ? 1 : -1) * 14, prog(t, 1.0, 2.0, 'out')) : 0;
    const st = { x: x + drag, y: y, s: lerp(1, 0.08, E.in(p)), o: p > 0.985 ? 0 : 1, r: lean + lerp(0, (hx < bau.x ? 1 : -1) * 160, p) };
    apply(el, st);
  });
  // papéis e poeira em espiral para o baú
  papers.forEach((d, i) => {
    const t0 = 1.2 + hash(i) * 5; const p = prog(t, t0, t0 + 2.6, 'lin');
    const ang = p * 8 + i; const rad = (1 - p) * (500 + hash(i + 9) * 500);
    apply(d, { x: bau.x + Math.cos(ang) * rad - 30, y: bau.y - 150 + Math.sin(ang) * rad * 0.5, s: lerp(1, 0.1, p), o: t < t0 || p >= 1 ? 0 : 0.85, r: ang * 50 });
  });
  kf($('black'), [{ t: 0, o: 1 }, { t: .6, o: 0 }, { t: 9.0, o: 0 }, { t: 10.0, o: 1, e: 'in' }], t);
  kf($('lbl'), [{ t: 0, o: 0 }, { t: .8, o: 1 }, { t: 9, o: 1 }, { t: 9.5, o: 0 }], t);
}
window.seek = seek; ready();
</script>
</body>
</html>
