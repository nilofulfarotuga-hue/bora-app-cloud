name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: false

      - name: Versão do Flutter
        run: flutter --version

      - name: Versões do ambiente
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Android SDK: $ANDROID_SDK_ROOT"

      - name: Limpar build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --verbose 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== GRADLE BUILD FAILURE — PRIMEIROS ERROS ==="
            grep -E "FAILURE:|> Task|error:|Error|Exception|Caused by:|e:" /tmp/flutter_build.log | head -60 || true
            echo "=== ÚLTIMAS 50 LINHAS DO LOG ==="
            tail -50 /tmp/flutter_build.log
          fi
          exit $BUILD_EXIT
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verificar APK gerado
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK INFO ==="
          echo "Run number  : ${{ github.run_number }}"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Flutter     : $(flutter --version | head -1)"
          echo "Tamanho     : $(du -sh $APK_PATH | cut -f1)"
          echo "SHA256      : $(sha256sum $APK_PATH)"
          echo "================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-run${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
