appId: com.example.bora_app
name: Estafeta — Aceitar entrega → recolhido → entregue
tags:
  - estafeta
  - entregas
  - golden
---
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_estafeta.yaml

# Pôr online se ainda não estiver.
- runFlow:
    when:
      visible: "Offline"
    commands:
      - tapOn: "Offline"
      - extendedWaitUntil:
          visible: "Online"
          timeout: 10000

# Aguardar oferta (DispatchEngine envia em ~10s tipicamente).
- extendedWaitUntil:
    visible:
      text: "Aceitar"
    timeout: 60000

- tapOn: "Aceitar"
- extendedWaitUntil:
    visible:
      text: "Recolhido|Marcar recolhido"
    timeout: 15000

- tapOn:
    text: "Recolhido|Marcar recolhido"
- extendedWaitUntil:
    visible:
      text: "Entregue|Marcar entregue"
    timeout: 15000

- tapOn:
    text: "Entregue|Marcar entregue"

# Código 4-dígitos (BR §7.7) — preencher com 0000 placeholder se solicitado.
- runFlow:
    when:
      visible:
        text: "Código"
    commands:
      - inputText: "0000"
      - tapOn: "Confirmar"

- extendedWaitUntil:
    visible:
      text: "delivered|entregue|Conclu"
    timeout: 30000
