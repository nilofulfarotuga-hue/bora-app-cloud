workflows:
  android-release:
    name: Bora App - Android Release APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.2
      java: 17
      groups:
        - bora_dart_defines
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: autonomous-night-*
          include: true
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Materialise secret files from env vars
        script: |
          if [ -n "$DART_DEFINES_FILE_B64" ]; then
            echo "$DART_DEFINES_FILE_B64" | base64 -d > "$CM_BUILD_DIR/.dart_defines"
            echo ".dart_defines created ($(wc -l < .dart_defines) lines)"
          else
            echo "ERROR: DART_DEFINES_FILE_B64 not set"; exit 1
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$CM_BUILD_DIR/android/app/google-services.json"
            echo "google-services.json created"
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_B64 not set"; exit 1
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK release
        script: |
          #!/usr/bin/env bash
          set +e

          # 1) Tentar flutter build SEM --verbose (mostra erros Gradle directos)
          flutter build apk --release \
            --dart-define-from-file=.dart_defines \
            --no-tree-shake-icons \
            2>&1 | tee "$CM_BUILD_DIR/apk_build.log"
          RC=${PIPESTATUS[0]}

          mkdir -p "$CM_BUILD_DIR/build/logs"
          cp "$CM_BUILD_DIR/apk_build.log" \
             "$CM_BUILD_DIR/build/logs/apk_build_full.log" 2>/dev/null || true

          if [ "$RC" != "0" ]; then
            echo ""
            echo "=== FLUTTER BUILD FALHOU (RC=$RC) ==="
            echo ""
            echo "=== LOG COMPLETO (sem verbose — erro Gradle visivel) ==="
            cat "$CM_BUILD_DIR/apk_build.log"
            echo ""
            echo "=== GRADLE DIRECTO COM STACKTRACE ==="
            cd "$CM_BUILD_DIR/android" && \
              ./gradlew assembleRelease --stacktrace --info \
              2>&1 | tail -200 || true
            exit $RC
          fi
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - build/logs/apk_build_full.log
      - apk_build.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - nilofulfarotuga@gmail.com
        notify:
          success: true
          failure: true

  android-debug:
    name: Bora App - Android Debug APK (faster, side-loadable)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.41.2
      java: 17
      groups:
        - bora_dart_defines
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: autonomous-night-*
          include: true
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Materialise .dart_defines from secret
        script: |
          if [ -n "$DART_DEFINES_FILE_B64" ]; then
            echo "$DART_DEFINES_FILE_B64" | base64 -d > "$CM_BUILD_DIR/.dart_defines"
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK debug
        script: |
          flutter build apk --debug \
            --dart-define-from-file=.dart_defines
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - nilofulfarotuga@gmail.com
        notify:
          success: true
          failure: true
