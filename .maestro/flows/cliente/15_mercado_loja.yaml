appId: pt.boraapp.bora
name: Cliente — Mercado (catálogo→carrinho, paramétrico)
tags:
  - cliente
  - mercados
env:
  STORE: "Continente"
  QUERY: "leite"
---
# Paramétrico: correr 1× por loja com -e STORE="...". Build 370: o "+" dos
# cards é ícone-puro (sem Semantics) — caminho alternativo: card → detalhe →
# tocar na LINHA da variante (InkWell no row inteiro, store_products_screen
# ~1229) → snackbar "adicionado ao carrinho". Valida catálogo, preço com
# markup runtime, carrinho com sacos €0.10/un e entrega. PARA no carrinho
# (não finaliza) — a compra completa (cash) é validada uma vez no golden path.
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_cliente.yaml

- tapOn: "Supermercados"
- extendedWaitUntil:
    visible: ".*${STORE}.*"
    timeout: 20000
- tapOn: ".*${STORE}.*"

# Catálogo carregado → header mostra Entrega €2,50 + ETA; pesquisar produto.
- extendedWaitUntil:
    visible: ".*Procurar em.*"
    timeout: 20000
- assertVisible: ".*Entrega.*"
- tapOn: ".*Procurar em.*"
- inputText: ${QUERY}
- extendedWaitUntil:
    visible: ".*€.*"
    timeout: 15000
- hideKeyboard

# Primeiro resultado (nome contém a query) → detalhe.
- tapOn:
    text: "(?i).*${QUERY}.*"
    index: 1
- extendedWaitUntil:
    visible: ".*€.*"
    timeout: 15000

# Linha da variante: preferir o badge "Mais barato"; senão o preço.
- runFlow:
    when:
      visible: ".*Mais barato.*"
    commands:
      - tapOn: ".*Mais barato.*"
- runFlow:
    when:
      notVisible: ".*adicionado ao carrinho.*"
    commands:
      - tapOn:
          text: ".*€[0-9].*"
          index: 0
- extendedWaitUntil:
    visible: ".*adicionado ao carrinho.*"
    timeout: 10000

# Carrinho: taxas do modelo não-parceiro visíveis.
- tapOn: ".*Carrinho.*"
- extendedWaitUntil:
    visible: ".*(Finalizar|Total).*"
    timeout: 15000
- assertVisible: ".*(Saco|saco).*"
- assertVisible: ".*(Entrega|entrega).*"
