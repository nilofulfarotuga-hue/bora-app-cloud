# Postiz (motor de publicação social) — preparado para o PC do Danilo (Docker Desktop).
# DECISÃO 2026-07-10 (missão noturna Fase 4): NÃO instalado na VPS — regra exigia
# ≥2.5 GB RAM livre e a VPS tinha 2.3 GiB disponíveis (free -h: total 3.8Gi, available
# 2.3Gi, 196Mi free; disco OK: 35G). Instalar ao lado do Hermes arriscava derrubá-lo.
#
# Como arrancar no PC (ver README-POSTIZ.md ao lado):
#   1. Instalar Docker Desktop (winget install Docker.DockerDesktop) e abrir uma vez
#   2. Copiar .env.example para .env e preencher JWT_SECRET (string aleatória longa)
#   3. docker compose up -d      → http://localhost:5000
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    environment:
      MAIN_URL: "http://localhost:5000"
      FRONTEND_URL: "http://localhost:5000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000/api"
      JWT_SECRET: "${JWT_SECRET:?definir no .env}"
      DATABASE_URL: "postgresql://postiz:${POSTGRES_PASSWORD:-postiz-local-pwd}@postiz-postgres:5432/postiz-db"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "5000:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postiz-local-pwd}"
      POSTGRES_USER: postiz
      POSTGRES_DB: postiz-db
    volumes:
      - postiz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz-db"]
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postiz-redis-data:/data

volumes:
  postiz-db-data:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
