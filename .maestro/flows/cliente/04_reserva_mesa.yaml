appId: com.example.bora_app
name: Cliente — Reservar mesa €3 (Reservas Pro)
tags:
  - cliente
  - reservas
---
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_cliente.yaml

- tapOn: "Reservar Mesa"
- extendedWaitUntil:
    visible: "Pizza"
    timeout: 10000
- tapOn:
    text: ".*[Pp]izza.*"
- waitForAnimationToEnd

# Picker de pessoas — chip "2".
- tapOn:
    text: "^2$"
    optional: true

# Continuar para checkout reserva.
- tapOn:
    text: "Continuar|Reservar"
- extendedWaitUntil:
    visible:
      text: "€3 retidos no cartão|Pagar €3 e reservar"
    timeout: 15000

# Verifica breakdown €1+€2 introduzido em PASSO 1 (commit cd041b2).
- assertVisible: "€1 taxa de serviço Bora App"
- assertVisible: "€2 crédito para usar no restaurante"

# Botão final (não confirma para evitar Stripe charge real em E2E).
- assertVisible: "Pagar €3 e reservar"
