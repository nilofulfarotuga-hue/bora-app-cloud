appId: pt.boraapp.bora
---
# Sub-flow: login como parceiro. Email teste9@bora (UID e663a627-...)
# associado ao restaurante partner-1778337167307322 ("pizza danilo").

# Dismiss GDPR consent dialog (aparece no primeiro launch após clearState).
- runFlow:
    when:
      visible: "Privacidade e Cookies"
    commands:
      - tapOn: "Aceitar tudo"
      - extendedWaitUntil:
          notVisible: "Privacidade e Cookies"
          timeout: 5000

- evalScript: ${output.email = MAESTRO_PARTNER_EMAIL ?? "teste9@bora"}
- evalScript: ${output.pwd = MAESTRO_PARTNER_PASSWORD ?? "Teste123456"}

- runFlow:
    when:
      visible: "Sou Parceiro"
    commands:
      - tapOn: "Sou Parceiro"
      - extendedWaitUntil:
          visible: "Email"
          timeout: 10000
      - tapOn: "Email"
      - inputText: ${output.email}
      - tapOn: "Palavra-passe"
      - inputText: ${output.pwd}
      - tapOn: "Entrar"
      - extendedWaitUntil:
          notVisible: "Entrar"
          timeout: 15000
