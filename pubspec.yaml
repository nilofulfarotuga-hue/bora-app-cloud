name: bora_app
description: Plataforma híbrida de entregas BORA

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  vibration: ^3.1.8
  provider: ^6.1.2
  http: ^1.2.0
  flutter_stripe: ^10.1.1
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.3.2

  # MAPA E LOCALIZAÇÃO
  geolocator: ^10.1.0
  geocoding: ^2.2.0
  google_maps_flutter: ^2.6.0
  latlong2: ^0.9.0
