s durante toda a semana. Confira o &uacute;mtimo cat&aacute;logo do Lidl Lidl folheto.\u003C/p>\r\n\u003Ch3>Lojas Lidl e Lidl Online\u003C/h3>\r\n\u003Cp>Comprar no Lidl &eacute; sin&oacute;nimo de poupar e atrav&eacute;s dos Lidl folhetos consegue estar semanalmente a par dos melhores descontos. Gra&ccedil;as &agrave; rela&ccedil;&atilde;o de confian&ccedil;a com os fornecedores, o Lidl oferece uma rela&ccedil;&atilde;o qualidade-pre&ccedil;o sem igual na categoria \u003Ca href=\"/supermercados/\">Supermercados\u003C/a> como pode comprovar no \u003Cstrong>cat&aacute;logo Lidl\u003C/strong>. Com o slogan &ldquo;Mais para si&rdquo;, o cliente &eacute; colocado em primeiro lugar, onde encontra uma vasta gama de produtos regionais e internacionais.\u003C/p>\r\n\u003Ch3>Hist&oacute;ria do Lidl\u003C/h3>\r\n\u003Cp>O Lidl est&aacute; em Portugal desde 1995 onde &eacute; reconhecido como uma empresa de confian&ccedil;a e fi&aacute;vel. A empresa integra o grupo alem&atilde;o Grupo Schwarz, com sede em Neckarsulm, e &eacute; um retalhistas alimentar l&iacute;der na Europa. Procura sempre agir hoje para um melhor amanh&atilde; e por isso as suas lojas e folhetos Lidl mostram uma preocupa&ccedil;&atilde;o pela sustentabilidade.\u003C/p>\r\n\u003Cp>O Lidl est&aacute; comprometido com a sustentabilidade e a prote&ccedil;&atilde;o do meio ambiente. Um dos seus grandes marcos neste campo foi a decis&atilde;o de eliminar a venda de sacos de pl&aacute;stico, substituindo-os por alternativas mais ecol&oacute;gicas, com o objetivo de reduzir o uso de 25 milh&otilde;es de sacos de pl&aacute;stico por ano. Este compromisso com o ambiente reflete-se tamb&eacute;m nas suas pr&aacute;ticas comerciais e nos produtos presentes no cat&aacute;logo Lidl, que procuram equilibrar qualidade, pre&ccedil;o e responsabilidade ambiental. Ao escolher o Lidl, est&aacute; tamb&eacute;m a fazer uma escolha consciente pelo futuro do planeta.\u003C/p>\r\n\u003Cp>&nbsp;\u003C/p>\r\n\u003Ch3>Onde comprar?\u003C/h3>\r\n\u003Cp>O Lidl possui 246 pontos de venda nas principais cidades \u003Ca href=\"/cidade/lisboa/lidl/\" title=\"Lidl Lisboa\">Lisboa\u003C/a>, \u003Ca href=\"/cidade/sintra/lidl/\" title=\"Lidl Sintra\">Sintra\u003C/a>, \u003Ca href=\"/cidade/vila-nova-de-gaia/lidl/\" title=\"Lidl Vila Nova de Gaia\">Vila Nova de Gaia\u003C/a>, \u003Ca href=\"/cidade/cascais/lidl/\" title=\"Lidl Cascais\">Cascais\u003C/a>, \u003Ca href=\"/cidade/porto/lidl/\" title=\"Lidl Porto\">Porto\u003C/a> e \u003Ca href=\"/cidade/loures/lidl/\" title=\"Lidl Loures\">Loures\u003C/a> e vilas portuguesas, adquirindo a produtores nacionais mais de metade dos produtos que s&atilde;o vendidos nas lojas e atrav&eacute;s do \u003Cstrong>folheto Lidl\u003C/strong>. As lojas est&atilde;o abertas das 8h30 &aacute;s 21h ou 22h.\u003C/p>\r\n\u003Cp>Consulte o site \u003Ca href=\"https://www.lidl.pt/\" target=\"_blank\">lidl.pt\u003C/a> e conhe&ccedil;a todos os produtos e marcas que o Lidl tem para lhe oferecer.\u003C/p>\r\n\u003Cp>Para comprar artigos alimentares, vestu&aacute;rio, eletrodom&eacute;sticos e muito mais pode encontrar os folhetos online tamb&eacute;m das lojas: \u003Ca href=\"/recheio/\" title=\"Recheio\">Recheio\u003C/a>, \u003Ca href=\"/continente/\" title=\"Continente\">Continente\u003C/a>, \u003Ca href=\"/intermarche/\" title=\"Intermarché\">Intermarché\u003C/a>, \u003Ca href=\"/pingo-doce/\" title=\"Pingo Doce\">Pingo Doce\u003C/a>, \u003Ca href=\"/aldi/\" title=\"Aldi\">Aldi\u003C/a>, \u003Ca href=\"/amanhecer/\" title=\"Amanhecer\">Amanhecer\u003C/a>, \u003Ca href=\"/mercadona/\" title=\"Mercadona\">Mercadona\u003C/a>, \u003Ca href=\"/makro/\" title=\"Makro\">Makro\u003C/a>, \u003Ca href=\"/coviran/\" title=\"Coviran\">Coviran\u003C/a> e \u003Ca href=\"/e-leclerc/\" title=\"E.Leclerc\">E.Leclerc\u003C/a>.\u003C/p>\r\n\u003Cp>Para facilitar ainda mais a sua experi&ecirc;ncia de compra, o Lidl disponibiliza uma aplica&ccedil;&atilde;o m&oacute;vel. Atrav&eacute;s da Lidl App  are clear and easy to browse. They are free to use, with no registration required. Kimbino users can have information about latest promotions or discounts before they are delivered to their mailbox.","The Kimbino app offers a wide range of latest leaflets from all your favourite stores. If you're a frequent shopper and don't have a leaflet available before you go to the store, we'd highly recommend taking advantage of this handy thing.","Of course, you can stick the classic \"Please don't drop leaflets in\" message on your mailbox. Kimbino, however, offers slightly more convincing stickers to promote greener leaflet distribution to your surroundings.","Source:","Sobre nós","Atividades de marketing","Sinto falta da loja","Sugestão de melhoria","Introduzir o teu e-mail","Podemos ajudá-lo?","Enviar mensagem","Tem questões? Contacte-nos.","Contacte-nos através de:","Está interessado em publicar a sua oferta na Kimbino?","Cancelar a cidade selecionada","Novo","Mais folhetos na categoria","E-mail","Entrar com o Facebook","Lembrar minha palavra-passe","Entrar com o Google","Inserir palavra-passe","Não tem uma conta?","Iniciar sessão","Registre-se aqui","Esqueci a senha","NOVO","O início de sessão foi bem sucedido.","A loja foi adicionada às suas subscrições.","Sigo a loja","A loja foi eliminada das lojas seguidas.","Folheto atual","Loja","Sortimento","Página não encontrada","Basta {spanStart}iniciar{spanEnd} uma sessão para receber {spanStart}regularmente novidades{spanEnd} da loja {spanStart}{shopName}{spanEnd}.","Atual","Abrir folheto","minha-conta","newsletter","lojas","outros","Configurações de conta","Adicionar mais lojas","Nova senha","Palavra-passe atual","senha","Guardar","Masculino","Entre novamente com sua senha nova","Feminino","Género","Cidade de residência","Newsletter especial","Newsletter diária","Newsletter semanal","E-mails que são enviados no caso de eventos especiais (Black Friday, Natal,…) e que incluem as principais ofertas para o evento","Data de nas servidor.","Os cookies estritamente necessários asseguram que as funcionalidades básicas do website estão a funcionar de forma adequada e não podem ser desativados no nosso website. Estes apenas podem ser desativados ao alterar as suas preferências no seu browser. São normalmente criados com base na sua atividade, como por exemplo, ao ativar as notificações, se registar ou responder a inquéritos. Os cookies estritamente necessários não armazenam dados pessoais, tais como o seu nome e apelido, entre outros.","Este website utiliza cookies para melhorar os nossos serviços. Os cookies são dados que o nosso servidor envia para o seu browser e que serão armazenados. Ao visitar novamente o nosso website, o browser irá lembrar-se destes dados. Essas informações podem ser utilizadas pela nossa empresa ou por terceiros. Os cookies ajudam-nos a compreender melhor o tráfego e comportamento, o que lhe permite visualizar anúncios personalizados e guardar as suas definições.","Cookies de desempenho","Cookies estritamente necessários","Informação geral","Com as ferramentas de análise (Google Analytics) e cookies relacionados, podemos melhorar continuamente o nosso website. Ao monitorizar e gravar informações, como as páginas que visitou e a respetiva duração da visita, podemos melhorar a sua visualização geral do website.","Cookies de marketing","A recolha dos cookies de marketing pode afetar a relevância dos anúncios que lhe são apresentados. Os nossos parceiros podem recolher informações e utilizar esses cookies para analisar e configurar a personalização de anúncios.","A desativação dos cookies de marketing não significa que estará a desativar os anúncios do nosso website, mas a alterar a relevância dos anúncios que lhe são apresentados. Os conteúdos que lhe serão apresentados podem não estar relacionados com os seus interesses.","Cookies utilizados","Os cookies do Facebook são utilizados para o registo de informações relativas aos utilizadores que visitaram o website da Kimbino, a partir de anúncios publicados no Facebook pela nossa empresa ou pelos nossos parceiros.","Utilizamos os cookies da Google para registar a sua visita ao nosso website e permitir a recomercialização com o Google AdWords para anúncios da Kimbino ou de parceiros.","Preocupamo-nos com as necessidades dos nossos utilizadores e respeitamos os seus direitos de privacidade, pelo que poderá optar por bloquear alguns tipos de cookies. Contudo, gostaríamos de chamar a sua atenção para o facto de que quando as definições de cookies são alteradas, poderemos limitar ou desativar completamente certas funcionalidades do nosso website. A sua experiência no nosso website poderá sofrer um impacto negativo.","Se visitou este website anteriormente e a aceitação de cookies já tiver sido ativada no browser, iremos considerar que aceita as nossas políticas de cookies.","Guardar definições","Permitir tudo","Mais informação","Definir política de privacidade","Palavra-passe incorreta.","Sua palavra-passe foi alterada.","A salvaguardar","Mostrar detalhes","E-mails com as melhores ofertas das suas lojas favoritas, mesmo sem subscrevê-las, enviados, no máximo, uma vez por semana","Subscrição confirmada","Subscrição cancelada","Principais","Vai começar","Produtos dos folhetos","Produtos","Mais produtos","{currentShop} na cidade de {currentCity} não tem nenhum folheto atual, mas...","Introduza o seu e-mail","Introduza a sua palavra-passe","Palavra-passe curta demais","de terça-feira","de quarta-feira","de segunda-feira","de quinta-feira","de sexta-feira","de domingo","de sábado","Senha não corresponde","Informação de início de sessão errada","undefined","Promoção","Todos os folhetos","A nova palavra-passe introduzida está errada.","Esqueceu sua senha?","Para recuperar a palavra-passe, deve confirmar o seu endereço e-mail. O e-mail com as instruções a seguir ser-lhe-á enviado para o endereço indicado.","Recuperar palavra-passe","Já enviamos um e-mail. Verifique sua caixa de entrada  para mais in
