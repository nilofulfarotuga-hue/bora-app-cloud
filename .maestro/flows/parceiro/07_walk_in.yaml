appId: pt.boraapp.bora
name: Parceiro — Walk-in (sentar cliente sem reserva)
tags:
  - parceiro
  - reservas
  - walk-in
---
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_parceiro.yaml

- scrollUntilVisible:
    element:
      text: ".*Reservas Pro.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Reservas Pro.*"
- extendedWaitUntil:
    visible:
      text: ".*Walk-in.*"
    timeout: 10000
- tapOn:
    text: ".*Walk-in.*"

- extendedWaitUntil:
    visible:
      text: ".*(Mesa|Lugar).*"
    timeout: 10000

- runFlow:
    when:
      visible: ".*Mesa.*"
    commands:
      - tapOn:
          text: ".*Mesa.*"
          index: 0

- tapOn:
    text: ".*(Sentar|Confirmar).*"
- extendedWaitUntil:
    visible:
      text: ".*Sentado.*"
    timeout: 15000
