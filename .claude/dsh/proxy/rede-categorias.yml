# Rede do Dipsy — categorias de sítios (missão m3-dipsy-acesso-total-2026-11-08, ordem do Danilo de 08/11/2026).
#
# Tudo o que o Dipsy faz na internet passa pelo proxy local (~/.dsh/proxy/proxy.py, só 127.0.0.1) e fica registado em
# ~/.dsh/proxy/registo.jsonl (domínio, método, tamanho, hora). O proxy e a guarda do Dipsy leem ESTE ficheiro.
#
# Como se muda (o Danilo não escreve aqui; fala com o Dipsy pelo Telegram):
#   /rede                      -> diz as categorias e o estado de cada uma
#   /rede abrir <categoria>    -> abre a categoria;  /rede fechar <categoria> -> fecha-a
#   Sítio fora das categorias  -> o Dipsy pergunta "Posso abrir X?" e a resposta fica em aprovados/recusados (abaixo).
#
# Regras:
#   estado: aberta | fechada.  so_leitura: true -> o proxy corta ligações que mandem mais de 1 MB para fora (uploads).
#   Domínio "x.pt" cobre também os subdomínios (www.x.pt, loja.x.pt). "docs.*" = qualquer sítio que comece por docs.
#   sempre_bloqueado: nunca abre por "Posso abrir?". Os grupos com com_sim: true abrem só 10 minutos, quando o Danilo
#   diz "sim" a UMA ação concreta (pagamento na Stripe, publicar, mandar mensagem). Os outros nunca abrem.

