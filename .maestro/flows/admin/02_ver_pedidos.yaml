appId: pt.boraapp.bora
name: Admin — Lista de pedidos activos
tags:
  - admin
  - pedidos
---
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_admin.yaml

- scrollUntilVisible:
    element:
      text: "^Pedidos$"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "^Pedidos$"
- extendedWaitUntil:
    visible:
      text: ".*(Activos|created|preparando|Sem pedidos).*"
    timeout: 10000
