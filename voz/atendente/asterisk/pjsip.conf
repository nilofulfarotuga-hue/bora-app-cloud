; Linha da Zadarma (conta SIP da Bora). Valores @...@ vêm do .env (arrancar.sh).
[transporte-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@IP_PUBLICO@
external_signaling_address=@IP_PUBLICO@

[zadarma-registo]
type=registration
transport=transporte-udp
outbound_auth=zadarma-auth
server_uri=sip:sip.zadarma.com
client_uri=sip:@ZADARMA_SIP_USER@@sip.zadarma.com
retry_interval=60
expiration=300

[zadarma-auth]
type=auth
auth_type=userpass
username=@ZADARMA_SIP_USER@
password=@ZADARMA_SIP_SENHA@

[zadarma]
type=endpoint
transport=transporte-udp
context=entrada-zadarma
disallow=all
allow=alaw,ulaw
outbound_auth=zadarma-auth
aors=zadarma
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[zadarma]
type=aor
contact=sip:sip.zadarma.com

; Só a Zadarma entra (a firewall da VPS também só abre 5060/RTP aos IPs da Zadarma).
[zadarma]
type=identify
endpoint=zadarma
match=sip.zadarma.com
