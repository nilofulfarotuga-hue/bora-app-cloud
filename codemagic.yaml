workflows:
  android-release:
    name: Bora App - Android Release AAB (signed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.2
      java: 17
      groups:
        - bora_dart_defines
        - bora_keystore
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: autonomous-night-*
          include: true
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Materialise secret files from env vars
        script: |
          if [ -n "$DART_DEFINES_FILE_B64" ]; then
            echo "$DART_DEFINES_FILE_B64" | base64 -d > "$CM_BUILD_DIR/.dart_defines"
            echo ".dart_defines created ($(wc -l < .dart_defines) lines)"
          else
            echo "ERROR: DART_DEFINES_FILE_B64 not set"; exit 1
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$CM_BUILD_DIR/android/app/google-services.json"
            echo "google-services.json created"
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_B64 not set"; exit 1
          fi
      - name: Materialise release keystore from env vars
        script: |
          if [ -z "$CM_KEYSTORE_B64" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "ERROR: keystore env vars missing (CM_KEYSTORE_B64 / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD)"
            exit 1
          fi
          KEYSTORE_PATH="$CM_BUILD_DIR/android/app/release.keystore"
          echo "$CM_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          echo "Keystore materialised ($(wc -c < "$KEYSTORE_PATH") bytes)"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=app/release.keystore
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          echo "key.properties created"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build AAB release (signed, Play Store)
        script: |
          flutter build appbundle --release \
            --build-number=$(($BUILD_NUMBER + 100)) \
            --dart-define-from-file=.dart_defines \
            --no-tree-shake-icons
    artifacts:
      - build/**/outputs/bundle/release/app-release.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - nilofulfarotuga@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
  android-debug:
    name: Bora App - Android Debug APK (faster, side-loadable)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.41.2
      java: 17
      groups:
        - bora_dart_defines
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: autonomous-night-*
          include: true
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Materialise .dart_defines from secret
        script: |
          if [ -n "$DART_DEFINES_FILE_B64" ]; then
            echo "$DART_DEFINES_FILE_B64" | base64 -d > "$CM_BUILD_DIR/.dart_defines"
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK debug
        script: |
          flutter build apk --debug \
            --dart-define-from-file=.dart_defines
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - nilofulfarotuga@gmail.com
        notify:
          success: true
          failure: true
