appId: pt.boraapp.bora
name: Cliente — Favor normal (cash)
tags:
  - cliente
  - favores
---
# errand_form_screen.dart → payment_method_screen.dart. Cash (€6 normal),
# sem Stripe. inputText só ASCII (limite do Maestro).
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_cliente.yaml

- tapOn: "Favores"
- extendedWaitUntil:
    visible: ".*Descreve o favor.*"
    timeout: 15000

# O form é um wizard de 3 passos com barra fixa "Total desde €6" + "Próximo".
# Passo 1: descrição (+chips de categoria, compra opcional).
- tapOn: ".*Descreve o favor.*"
- inputText: "Compra um jornal para mim na loja mais proxima"
- hideKeyboard
- tapOn: "Próximo"

# Passo 2 "Onde é o favor?": Local do favor + Onde entregar (obrigatórios;
# "Próximo" fica cinzento até preencher). Sem taps em sugestões (misfire
# na 3ª tentativa: um tap em ".*Guarda.*" acertou fora do form e voltou à
# home) — digitar simples + fechar teclado.
- extendedWaitUntil:
    visible: ".*Local do favor.*"
    timeout: 10000
- tapOn: ".*Local do favor.*"
- inputText: "Rua Teste 14 Guarda"
- hideKeyboard
- tapOn: ".*Onde entregar.*"
- inputText: "Rua do Torreao 10 Guarda"
- hideKeyboard
- tapOn: "Próximo"

# Passo 3: velocidade Normal (tile com emoji — full match precisa .*).
- runFlow:
    when:
      visible: ".*Normal.*"
    commands:
      - tapOn: ".*Normal.*"

- scrollUntilVisible:
    element:
      text: ".*(Continuar para pagamento|Próximo).*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*(Continuar para pagamento|Próximo).*"

# Pagamento — Dinheiro (nunca cartão real).
- extendedWaitUntil:
    visible: ".*(método de pagamento|Dinheiro).*"
    timeout: 15000
- tapOn: ".*Dinheiro.*"
- scrollUntilVisible:
    element:
      text: ".*Confirmar pagamento.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Confirmar pagamento.*"

- extendedWaitUntil:
    visible:
      text: ".*(criado|preparando|a preparar|Favor|procurar).*"
    timeout: 30000
