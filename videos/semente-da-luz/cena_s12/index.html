<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A Semente da Luz — s12 a casa da avó (motion 2D)</title>
<style>
@font-face { font-family:'Inter'; src:url('../assets/Inter-VariableFont.ttf') format('truetype'); font-weight:100 900; }
html,body { margin:0; background:#000; overflow:hidden; font-family:'Inter',sans-serif; }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#F3E5C8; transform-origin:0 0; overflow:hidden; }
body.port #stage { width:1080px; height:1920px; }
.el { position:absolute; left:0; top:0; will-change:transform,opacity; }
.hidden { visibility:hidden; }
#room { left:0; top:0; width:100%; height:100%; }
.kid { transform-origin:50% 100%; }
.kid img { height:700px; display:block; }
body.port .kid img { height:560px; }
#glow { width:420px; height:420px; margin:-210px 0 0 -210px; border-radius:999px; background:radial-gradient(circle, #FFF3C4 0%, #FFD54F 22%, #4FC3F7 48%, rgba(79,195,247,0) 70%); filter:blur(8px); transform-origin:50% 50%; }
#sub { left:50%; top:auto; bottom:60px; transform:translateX(-50%); max-width:1500px; background:rgba(0,0,0,.62); color:#fff; font-size:44px; font-weight:600; padding:18px 34px; border-radius:16px; text-align:center; line-height:1.3; }
body.port #sub { max-width:960px; font-size:40px; bottom:90px; }
#sub b { color:#FFD54F; font-weight:800; }
#black { left:0; top:0; width:100%; height:100%; background:#000; }
#lbl { left:40px; top:30px; font-size:26px; font-weight:600; color:rgba(0,0,0,.45); letter-spacing:.1em; }
</style>
</head>
<body>
<div id="stage">
  <svg id="room" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
    <rect width="1920" height="1080" fill="#F3E5C8"/>
    <rect y="0" width="1920" height="60" fill="#E7D5B2"/>
    <!-- rodapé e chão de madeira -->
    <rect y="820" width="1920" height="260" fill="#C9955B"/><rect y="820" width="1920" height="26" fill="#E7D5B2"/>
    <g stroke="#B5804A" stroke-width="4"><path d="M0 900 H1920 M0 960 H1920 M0 1020 H1920"/></g>
    <!-- janela com luz da tarde -->
    <rect x="1380" y="120" width="360" height="420" rx="10" fill="#BFE3FF" stroke="#FFF" stroke-width="18"/><path d="M1560 120 V540 M1380 330 H1740" stroke="#FFF" stroke-width="12"/>
    <!-- estante com caixas; a de cima brilha -->
    <rect x="160" y="200" width="520" height="640" rx="8" fill="#A9774A"/><rect x="190" y="230" width="460" height="580" fill="#8C5F38"/>
    <g stroke="#A9774A" stroke-width="14"><path d="M190 430 H650 M190 620 H650"/></g>
    <g id="cx"><rect x="230" y="660" width="170" height="140" rx="6" fill="#D2A775"/><rect x="430" y="660" width="190" height="140" rx="6" fill="#C89A68"/>
      <rect x="250" y="470" width="160" height="140" rx="6" fill="#D2A775"/><rect x="440" y="470" width="180" height="140" rx="6" fill="#DDB383"/>
      <g stroke="#8C5F38" stroke-width="4" opacity=".6"><path d="M230 700 H400 M430 700 H620 M250 510 H410 M440 510 H620"/></g></g>
    <g id="caixaTopo"><rect x="300" y="280" width="220" height="140" rx="8" fill="#E0B98A" stroke="#B5804A" stroke-width="6"/><path d="M300 320 H520" stroke="#B5804A" stroke-width="5"/><text x="410" y="385" font-family="Inter" font-weight="800" font-size="30" fill="#8C5F38" text-anchor="middle">BISAVÔ</text></g>
    <!-- caixas no chão -->
    <rect x="760" y="700" width="260" height="140" rx="8" fill="#D2A775"/><rect x="780" y="580" width="220" height="130" rx="8" fill="#DDB383"/>
    <rect x="1060" y="720" width="200" height="120" rx="8" fill="#C89A68"/>
  </svg>
  <div id="glow" class="el"></div>
  <div id="k1" class="el kid"><img src="../assets/tabita_frente.png" alt=""></div>
  <div id="k2" class="el kid"><img src="../assets/tailine_frente.png" alt=""></div>
  <div id="sub" class="el"><b id="who">TABITA</b> — <span id="line"></span></div>
  <div id="black" class="el"></div>
  <div id="lbl" class="el">b2 · s12 — a casa da avó · motion 2D</div>
</div>
<script src="../_engine.js"></script>
<script>
fitStage();
$('sub').dataset.base = 'translateX(-50%)';
const roomScale = Math.max(SW / 1920, SH / 1080); const offX = (SW - 1920 * roomScale) / 2, offY = SH - 1080 * roomScale;
const topBox = { x: offX + 410 * roomScale, y: offY + 350 * roomScale };
$('glow').style.left = topBox.x + 'px'; $('glow').style.top = topBox.y + 'px';
const KH = PORT ? 560 : 700;
const pos = PORT ? [[180, 1560], [600, 1560]] : [[820, 1000], [1250, 1000]];
// falas reais (saida/v4/voz): s12_1 Tabita 0.8→4.2 · s12_2 Tailine 5.0→8.1
const L1 = [0.8, 4.2], L2 = [5.0, 8.1];
function talk(t, a, b) { return t >= a && t <= b ? 1 + 0.012 * Math.sin(t * 22) : 1; }
function seek(t) {
  kf($('black'), [{ t: 0, o: 1 }, { t: .5, o: 0 }, { t: 9.3, o: 0 }, { t: 10.0, o: 1, e: 'in' }], t);
  kf($('lbl'), [{ t: 0, o: 0 }, { t: .8, o: 1 }, { t: 9, o: 1 }, { t: 9.5, o: 0 }], t);
  // Tabita entra pela esquerda decidida (0.3–1.2); Tailine já está, olha para a caixa em 5.0
  const e1 = prog(t, 0.3, 1.2, 'soft');
  apply($('k1'), { x: lerp(pos[0][0] - 500, pos[0][0], e1), y: pos[0][1] - KH + Math.abs(Math.sin(t * 9)) * (e1 < 1 ? 10 : 0), s: talk(t, ...L1), o: 1, r: lerp(-4, 0, e1) });
  const look = prog(t, 5.0, 5.6, 'soft');
  apply($('k2'), { x: pos[1][0], y: pos[1][1] - KH + Math.sin(t * 2) * 2, s: talk(t, ...L2), o: 1, r: -6 * look });
  // o brilho da caixa de cima: pulsa fraco, forte a partir da fala da Tailine
  const base = 0.35 + 0.15 * Math.sin(t * 5); const strong = prog(t, 5.6, 7.0, 'out');
  apply($('glow'), { x: 0, y: 0, s: lerp(0.7, 1.3, strong) * (1 + 0.05 * Math.sin(t * 9)), o: lerp(base, 0.95, strong), r: 0 });
  // legendas
  const sub = $('sub');
  if (t >= L1[0] && t <= L1[1] + 0.4) { $('who').textContent = 'TABITA'; $('line').textContent = 'Então bora ajudar! Cada um pega uma.'; apply(sub, { x: 0, y: 0, s: 1, o: 1, r: 0 }); }
  else if (t >= L2[0] && t <= L2[1] + 0.6) { $('who').textContent = 'TAILINE'; $('line').textContent = 'Vovó, por que a caixa de cima está brilhando?'; apply(sub, { x: 0, y: 0, s: 1, o: 1, r: 0 }); }
  else apply(sub, { x: 0, y: 0, s: 1, o: 0, r: 0 });
}
window.seek = seek; ready();
</script>
</body>
</html>
