# BUILD-APK-FIX (2026-05-18) — Xmx 512m era insuficiente para AGP 8.9 +
# Kotlin 2.x. Aumentado para 4g (padrao Android Studio moderno). Codemagic
# mac_mini_m2 tem 16GB; daemon limitado pelo Xmx aqui.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
android.useAndroidX=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# BUILD-APK-FIX (2026-05-18) — Opt-out do "new DSL" do AGP 9+.
# Flutter ferramenta actual ativa `android.newDsl=true` por defeito quando
# deteta AGP 9+, e isso quebra a aplicacao do Flutter Gradle plugin no
# android/app/build.gradle.kts (pattern antigo). Esta flag preserva o
# pattern em uso ate a migracao AGP 9 estar completa.
# Doc: https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.newDsl=false
