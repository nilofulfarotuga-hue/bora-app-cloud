appId: pt.boraapp.bora
name: Estafeta — Ver ganhos + tokens
tags:
  - estafeta
  - ganhos
  - tokens
---
- launchApp:
    clearState: true
- runFlow: ../../_shared/login_estafeta.yaml

- tapOn:
    text: ".*Ganhos.*"
- extendedWaitUntil:
    visible:
      text: ".*(€|Total).*"
    timeout: 10000

# Tokens ganhos.
- runFlow:
    when:
      visible: ".*Tokens.*"
    commands:
      - tapOn: ".*Tokens.*"
      - extendedWaitUntil:
          visible:
            text: ".*[Tt]okens.*"
          timeout: 10000
